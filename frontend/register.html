<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register CampusGear</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
  radial-gradient(circle at top left,#2563eb 0%,transparent 30%),
  radial-gradient(circle at bottom right,#7c3aed 0%,transparent 30%),
  #020617;
  color:white;
  padding:30px;
}

.register-card{
  width:450px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:30px;
  padding:40px;
  backdrop-filter:blur(20px);
}

.register-card h1{
  margin-bottom:10px;
}

.register-card p{
  color:#cbd5e1;
  margin-bottom:30px;
  font-size:14px;
}

.input-group{
  margin-bottom:20px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1;
  font-size:14px;
}

.input-group input,
.input-group select{
  width:100%;
  padding:15px;
  border:none;
  outline:none;
  border-radius:14px;
  background:#1e293b;
  color:white;
  border:1px solid rgba(255,255,255,0.08);
}

.input-group input:focus,
.input-group select:focus{
  border-color:#3b82f6;
}

.register-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  cursor:pointer;
  font-size:16px;
  margin-top:10px;
}

.bottom-text{
  text-align:center;
  margin-top:20px;
  color:#cbd5e1;
  font-size:14px;
}

.bottom-text a{
  color:#3b82f6;
  text-decoration:none;
}

</style>

</head>
<body>

<div class="register-card">

  <h1>Register Account</h1>

  <p>
    Daftarkan akun CampusGear menggunakan data resmi kampus.
  </p>

  <div class="input-group">
    <label>Nama Lengkap</label>

    <input
      type="text"
      id="nama"
      placeholder="Masukkan nama lengkap"
    >
  </div>

  <div class="input-group">
    <label>Role</label>

    <select id="role">

      <option value="mahasiswa">
        Mahasiswa
      </option>

      <option value="dosen">
        Dosen
      </option>

    </select>
  </div>

  <div class="input-group">
    <label>NPM / NIDN</label>

    <input
      type="text"
      id="nomor_identitas"
      placeholder="Masukkan NPM / NIDN"
    >
  </div>

  <div class="input-group">
    <label>Nomor HP</label>

    <input
      type="text"
      id="nomor_hp"
      placeholder="08xxxxxxxxxx"
    >
  </div>

  <div class="input-group">
    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
    >
  </div>

  <button
    class="register-btn"
    onclick="register()"
  >
    Register Sekarang
  </button>

  <div class="bottom-text">

    Sudah punya akun?
    <a href="index.html">
      Login
    </a>

  </div>

</div>

<script>

async function register(){

  const nama =
    document.getElementById('nama').value;

  const role =
    document.getElementById('role').value;

  const nomor_identitas =
    document.getElementById('nomor_identitas').value;

  const nomor_hp =
    document.getElementById('nomor_hp').value;

  const password =
    document.getElementById('password').value;

  if(
    nama === '' ||
    nomor_identitas === '' ||
    nomor_hp === '' ||
    password === ''
  ){

    alert('Semua field wajib diisi');
    return;

  }

  try{

    const response = await fetch(
      'http://localhost:3000/auth/register',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          nama,
          nomor_identitas,
          nomor_hp,
          password,
          role
        })
      }
    );

    const result = await response.json();

    alert(result.message);

    if(result.message === 'Register berhasil'){

      window.location.href = 'index.html';

    }

  }catch(error){

    console.log(error);

    alert('Backend tidak terhubung');

  }

}

</script>

</body>
</html>
