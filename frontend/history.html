<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Peminjaman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="js/api-helper.js"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body{ background:#020617; color:white; min-height:100vh; }
.navbar{ padding:20px 8%; display:flex; justify-content:space-between; align-items:center; background:#0f172a; border-bottom:1px solid rgba(255,255,255,.08); }
.logo{ font-size:28px; font-weight:700; }
.logo span{ color:#3b82f6; }
.nav-buttons{ display:flex; gap:10px; }
.btn{ padding:10px 18px; border:none; border-radius:10px; cursor:pointer; color:white; font-family:'Poppins',sans-serif; }
.back-btn{ background:#3b82f6; }
.logout-btn{ background:#ef4444; }
.container{ padding:40px 8%; }
.title{ margin-bottom:25px; }
.title h1{ font-size:38px; margin-bottom:5px; }
.title p{ color:#94a3b8; }
.table-box{ overflow-x:auto; background:#0f172a; border-radius:16px; border:1px solid rgba(255,255,255,.08); }
table{ width:100%; border-collapse:collapse; }
th{ background:#1e293b; padding:18px; text-align:left; }
td{ padding:18px; border-top:1px solid rgba(255,255,255,.08); }
.status{ padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; }
.menunggu{ background:#f59e0b; color:white; }
.disetujui{ background:#22c55e; color:white; }
.ditolak{ background:#ef4444; color:white; }
.dikembalikan{ background:#3b82f6; color:white; }
.empty{ text-align:center; padding:40px; color:#94a3b8; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Campus<span>Gear</span></div>
  <div class="nav-buttons">
    <button class="btn back-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
    <button class="btn logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">
  <div class="title">
    <h1>📋 Riwayat Peminjaman</h1>
    <p>Daftar seluruh peminjaman yang pernah kamu ajukan</p>
  </div>
  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>Barang</th>
          <th>Kelas</th>
          <th>Tanggal Pinjam</th>
          <th>Tanggal Kembali</th>
          <th>Keperluan</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="history-list"></tbody>
    </table>
  </div>
</div>

<script>
const user  = JSON.parse(localStorage.getItem('user'));
const token = localStorage.getItem('token');

if (!user || !token) {
  alert('Silakan login terlebih dahulu');
  window.location.href = 'index.html';
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = 'index.html';
}

function formatTanggal(tgl) {
  if (!tgl) return '-';
  return tgl.split('T')[0];
}

async function loadHistory() {
  try {
    const response = await fetch('https://campusgear-production.up.railway.app/peminjaman/riwayat', {
      headers: { 'Authorization': 'Bearer ' + token }
    });

    if (response.status === 401) { logout(); return; }

    const result = await response.json();
    const data   = result.data || [];
    const list   = document.getElementById('history-list');

    if (data.length === 0) {
      list.innerHTML = `<tr><td colspan="6" class="empty">Belum ada riwayat peminjaman</td></tr>`;
      return;
    }

    list.innerHTML = '';
    data.forEach(item => {
      list.innerHTML += `
        <tr>
          <td>${item.barang    || '-'}</td>
          <td>${item.kelas     || '-'}</td>
          <td>${formatTanggal(item.tgl_pinjam)}</td>
          <td>${formatTanggal(item.tgl_kembali)}</td>
          <td>${item.keperluan || '-'}</td>
          <td><span class="status ${item.status}">${item.status}</span></td>
        </tr>
      `;
    });

  } catch(error) {
    console.log(error);
    alert('Gagal mengambil data riwayat');
  }
}

loadHistory();
</script>
</body>
</html>
